<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Cube Outer Hexagon -->
  <polygon points="12,20 32,10 52,20 52,45 32,55 12,45" />

  <!-- Y-junction dividing Top Roof, Left Wall, Right Wall -->
  <line x1="32" y1="30" x2="12" y2="20" />
  <line x1="32" y1="30" x2="52" y2="20" />
  <line x1="32" y1="30" x2="32" y2="55" />

  <!-- Kiswah Belt (Hizam) Upper line -->
  <line x1="12" y1="27" x2="32" y2="37" />
  <line x1="32" y1="37" x2="52" y2="27" />

  <!-- Kiswah Belt (Hizam) Lower line -->
  <line x1="12" y1="31" x2="32" y2="41" />
  <line x1="32" y1="41" x2="52" y2="31" />

  <!-- Door of Kaaba (Bab al-Kaaba) on Right Wall -->
  <polygon points="38,38 46,34 46,46 38,50" />

  <!-- Base Foundation (Shadharwan) -->
  <polyline points="7,46 32,59 57,46" stroke-width="2.2" />
</svg>
